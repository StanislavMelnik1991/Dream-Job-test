<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Входящие заявки</title>
  <style>
    body { max-width: 40rem; margin: 2rem auto; padding: 0 1rem; font: 1rem/1.5 system-ui, sans-serif; }
    textarea { box-sizing: border-box; display: block; width: 100%; margin: .5rem 0; padding: .5rem; font: inherit; }
    button { padding: .4rem .8rem; font: inherit; }
    pre { white-space: pre-wrap; }
  </style>
</head>
<body>
  <h1>Входящие заявки</h1>
  <form>
    <label for="message">Текст заявки</label>
    <textarea id="message" rows="4"></textarea>
    <button type="submit">Разобрать заявку</button>
  </form>
  <section id="result" aria-live="polite" aria-atomic="true">
    <p id="status"></p>
    <div id="ready" hidden>
      <p><strong>Тема</strong> · <span id="topic"></span></p>
      <p><strong>Черновик ответа</strong></p>
      <pre id="draft"></pre>
    </div>
  </section>
  <script type="module">
    const form = document.querySelector("form");
    const message = document.querySelector("#message");
    const status = document.querySelector("#status");
    const ready = document.querySelector("#ready");
    const topic = document.querySelector("#topic");
    const draft = document.querySelector("#draft");
    const topicLabels = new Map([
      ["delivery", "Доставка"],
      ["pricing", "Стоимость"],
      ["other", "Другое"],
    ]);
    const invalidInput = "Введите текст заявки.";
    const manualReview = "Не удалось подготовить черновик. Разберите заявку вручную.";
    let activeRequest;

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      activeRequest?.abort();
      ready.hidden = true;
      topic.textContent = "";
      draft.textContent = "";

      const text = message.value.trim();
      if (!text) {
        status.textContent = invalidInput;
        return;
      }

      const request = new AbortController();
      activeRequest = request;
      status.textContent = "Разбираем заявку…";
      try {
        const reply = await fetch("/api/triage", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ text }),
          signal: request.signal,
        });
        const data = await reply.json();
        if (request.signal.aborted) return;

        if (reply.status === 400 && data?.status === "invalid_input") {
          status.textContent = invalidInput;
        } else if (reply.status === 413) {
          status.textContent = "Сократите текст заявки и повторите попытку.";
        } else if (reply.ok && data?.status === "ready" && topicLabels.has(data.topic)
          && typeof data.draft === "string" && data.draft.trim()) {
          status.textContent = "";
          topic.textContent = topicLabels.get(data.topic);
          draft.textContent = data.draft;
          ready.hidden = false;
        } else {
          status.textContent = manualReview;
        }
      } catch {
        if (!request.signal.aborted) status.textContent = manualReview;
      }
    });
  </script>
</body>
</html>
